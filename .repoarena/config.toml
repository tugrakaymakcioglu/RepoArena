schema_version = 1

[benchmark]
quality_threshold = 70
timeout_seconds = 900
baseline_repetitions = 2
max_patch_files = 50
max_patch_lines = 2000
max_patch_bytes = 5000000

[sandbox]
engine = "docker"
cpus = 2.0
memory = "4g"
pids_limit = 512
solver_network = "provider-only"
setup_network = "bridge"
proxy_image = "repoarena/egress-proxy:local"

[github]
source = "auto"
request_timeout_seconds = 30

[verification]
profile = "auto"
setup_commands = []
test_command = []

[agents.codex]
enabled = true
image = "repoarena/codex:local"
executable = "codex"
allowed_domains = [
    ".openai.com",
    ".chatgpt.com",
    ".oaistatic.com",
    ".oaiusercontent.com",
]

[agents.claude]
enabled = true
image = "repoarena/claude:local"
executable = "claude"
allowed_domains = [
    ".anthropic.com",
    ".claude.ai",
]

[agents.gemini]
enabled = false
image = "repoarena/gemini:local"
executable = "gemini"
allowed_domains = [
    ".googleapis.com",
]

[agents.openrouter]
enabled = false
image = "repoarena/opencode:local"
executable = "opencode"
allowed_domains = [
    ".openrouter.ai",
]
provider_id = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[agents.router]
enabled = false
image = "repoarena/opencode:local"
executable = "opencode"
allowed_domains = [
    "host.docker.internal",
]
provider_id = "router"
base_url = "http://host.docker.internal:20128/v1"
api_key_env = "ROUTER_API_KEY"
