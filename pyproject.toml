[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repoarena"
version = "0.1.0"
description = "SWE-bench for your own repository: benchmark AI coding agents on real project history."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "RepoArena contributors" }]
keywords = [
  "ai",
  "benchmark",
  "claude",
  "coding-agent",
  "codex",
  "developer-tools",
  "docker",
  "evaluation",
  "git",
  "github",
  "llm",
  "swe-bench",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "rich>=13.9,<15",
  "tomli-w>=1.1,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
repoarena = "repoarena.cli.app:app"

[project.urls]
Homepage = "https://github.com/tugrakaymakcioglu/RepoArena"
Issues = "https://github.com/tugrakaymakcioglu/RepoArena/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/repoarena"]

[tool.hatch.build]
exclude = [
  "/.coverage",
  "/.git",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.repoarena",
  "/.ruff_cache",
  "/.venv",
  "/dist",
  "*.db",
  "*.log",
  "*.patch",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "docker: requires a reachable Docker daemon",
  "provider: makes a real provider call and is opt-in",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["E501", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S607"]
"src/repoarena/benchmark/models.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["repoarena"]
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["repoarena"]

[tool.coverage.report]
show_missing = true
skip_covered = true
